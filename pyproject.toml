[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neomind"
version = "0.2.0"
description = "NeoMind — Multi-provider CLI coding agent and personal assistant"
readme = "README.md"
authors = [
    {name = "neomind", email = "noreply@neomind.dev"}
]
license = {file = "LICENSE"}
keywords = ["neomind", "ai", "agent", "llm", "cli", "deepseek", "glm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    # imported by agent/llm_url_guard.py, integration/telegram_bot.py,
    # finance/cockpit.py, data_sources/sec_edgar.py and the runtime's
    # OpenAI-compatible stream adapter, but declared nowhere until now —
    # a clean install would have failed at import, not at install.
    "httpx>=0.27",
    "PyYAML>=6.0",
    "prompt_toolkit>=3.0.0",
    "rich>=13.0.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
full = [
    "lxml>=4.9.0",
    "html2text>=2020.1.16",
    "chardet>=5.0.0",
    "requests-html>=0.10.0",
    "trafilatura>=1.4.0",
    "readability-lxml>=0.8.1",
    "tiktoken>=0.5.0",
    "duckduckgo-search>=4.0.0",
    "feedparser>=6.0.0",
    "flashrank>=0.2.0",
    # Tavily — agent's primary internet search source (LLM-optimized,
    # 1000 free searches/month). agent/search/sources.py reads
    # TAVILY_API_KEY at import time; missing key → tier2 fallback.
    "tavily-python>=0.5.0",
]
web = [
    "trafilatura>=1.4.0",
    "readability-lxml>=0.8.1",
    "html2text>=2020.1.16",
    "lxml>=4.9.0",
    "playwright>=1.40.0",
    "crawl4ai>=0.3.0",
    "playwright-stealth>=1.0.0",
]
finance = [
    "finnhub-python>=2.4.0",
    "yfinance>=0.2.30",
    "akshare>=1.10.0",
    "feedparser>=6.0.0",
    "cryptography>=41.0.0",
    "keyring>=24.0.0",
    "sympy>=1.12",
    "websockets>=12.0",
    "trafilatura>=1.4.0",
    "duckduckgo-search>=4.0.0",
    # Tavily — primary search source (also see [search] extra)
    "tavily-python>=0.5.0",
    "python-telegram-bot>=20.0",
    "playwright>=1.40.0",
    # added 2026-04-25: scheduler for periodic data pulls + analysis
    # runs (agent/finance/scheduler/). pandas is needed by yfinance
    # and pulled in transitively but pinned here to make it explicit.
    "apscheduler>=3.10.0",
    "pandas>=2.0.0",
    # added 2026-04-26 (Phase B1): WARC reader/writer for the
    # content-addressed raw store under agent/finance/raw_store/.
    "warcio>=1.7",
    # added 2026-05-02: parse House Clerk PTR PDFs to track Pelosi /
    # Khanna trades that Quiver Quant gates behind their paid tier.
    # See agent/finance/regime/scanners/house_clerk_pdf_scanner.py.
    "pdfplumber>=0.11.0",
]
rag = [
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.2.0",
    "PyPDF2>=3.0.0",
]
dev = [
    "pytest",
    "pytest-asyncio>=1.2.0",
    "pytest-timeout",
    # Both are import-time requirements of the test suite, not optional extras:
    # without playwright 24 web test files fail collection and without
    # hypothesis one more does. They were installed by hand in .venv and never
    # declared, so .venv passed while the py3.14 venv reported 25 collection
    # errors — a "dual-environment" claim that only ever held in one of them.
    # A fresh `pip install -e ".[dev]"` must be able to collect the suite.
    "playwright",
    "hypothesis",
    "black",
    "isort",
]

[project.scripts]
neomind = "main:main"

[tool.setuptools]
packages = ["agent", "agent.search", "agent.finance", "agent.browser", "agent.workflow", "agent.skills", "agent.web", "cli", "neomind"]
py-modules = ["agent_config", "main"]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests", "tests/llm"]
# A hung test must fail alone, not take the suite with it. Twice now a single
# test blocked every run forever (a mocked queue that never raised Empty, then
# a StopIteration that could not be set on a Future), and each time the whole
# suite was unrunnable until someone chased it down by hand — every "N passed"
# recorded before that was a subset result.
# 300s is deliberately generous: tests/llm makes real API calls, so the budget
# has to clear a slow provider round-trip while still catching an infinite wait.
# Method is `signal` (not `thread`): SIGALRM interrupts the blocked test and
# lets the run continue, whereas the thread method kills the whole process.
timeout = 300
timeout_method = "signal"
markers = [
    "llm: tests requiring real LLM API calls (always run if API key available)",
    "lattice_fast: spec + formulas + endpoint coherence (pure Python, <10s, pre-commit)",
    "lattice_slow: graph + viz + Playwright (CI only)",
    "lattice_drift: fixture regression + judge baseline (nightly)",
    "llm: needs a real provider call",
    "proc: spawns a subprocess",
    "slow: waits on a real timeout on purpose",
    "live: legacy alias for llm; declared so it stops warning",
]

[tool.setuptools.package-data]
"agent" = ["config/*.yaml"]
